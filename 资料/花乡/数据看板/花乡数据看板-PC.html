// #AI:design 单层圆环展示三个互斥分类，斜线覆盖装修中扇区的异常停工比例。
function renovationDonut(items,colors){
  const total=items[0][1]+items[1][1]+items[2][1], point=(r,a)=>`${120+r*Math.cos(a)} ${120+r*Math.sin(a)}`;
  if(!total)return '<div class="pie empty-chart">暂无数据</div>';
  const start=-Math.PI/2, unit=2*Math.PI/total,gap=Math.PI/90;
  function arc(label,value,index,color,a,b,mid,pattern=false){
    if(value<=0||b<=a)return '';
    const outer=92,inner=60,large=b-a>Math.PI?1:0,percent=(value/total*100).toFixed(1)+'%';
    const path=b-a>=2*Math.PI-1e-8?`M ${point(outer,a)} A ${outer} ${outer} 0 1 1 ${point(outer,a+Math.PI)} A ${outer} ${outer} 0 1 1 ${point(outer,b)} L ${point(inner,b)} A ${inner} ${inner} 0 1 0 ${point(inner,a+Math.PI)} A ${inner} ${inner} 0 1 0 ${point(inner,a)} Z`:`M ${point(outer,a)} A ${outer} ${outer} 0 ${large} 1 ${point(outer,b)} L ${point(inner,b)} A ${inner} ${inner} 0 ${large} 0 ${point(inner,a)} Z`;
    return `<path class="pie-segment${pattern?' pie-hatch':''}" tabindex="0" aria-label="${label} ${value}项，占总量 ${percent}" data-index="${index}" data-label="${label}" data-count="${value}" data-percent="${percent}" fill="${pattern?'url(#renovation-hatch)':color}" style="--dx:${9*Math.cos(mid)}px;--dy:${9*Math.sin(mid)}px;--shadow:${color}66" d="${path}"/>`;
  }
  const angles=[start,start+items[0][1]*unit,start+(items[0][1]+items[1][1])*unit,start+total*unit];
  const bounds=items.slice(0,3).map((item,i)=>{const rawA=angles[i],rawB=angles[i+1],inset=Math.min(gap/2,(rawB-rawA)/4);return [rawA+inset,rawB-inset,(rawA+rawB)/2]});
  const [a,b,mid]=bounds[1], split=b-(b-a)*items[3][1]/items[1][1];
  const main=items.slice(0,3).map((item,i)=>arc(item[0],item[1],i,colors[i],...bounds[i])).join('');
  return `<div class="pie"><svg viewBox="0 0 240 240" aria-label="装修数据占比，示例"><defs><pattern id="renovation-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M 0 0 V 6" stroke="#fff" stroke-opacity=".85" stroke-width="2"/></pattern></defs>${main}${arc(items[3][0],items[3][1],3,colors[1],split,b,mid,true)}</svg><span class="pie-center" aria-live="polite"></span></div>`;
}
function renderDashboard(){let labels=getPeriod();chartSequence=0;let urls=['https://2sc-erp.xinche365.cn/#/tenement-applyFor','https://2sc-erp.xinche365.cn/#/tenement-operations','https://2sc-erp.xinche365.cn/#/tenement-property',''];// #AI:design 待处理事项按用户指定业务结构显示当前示例数字。
document.getElementById('todo-overview').innerHTML=`<section class="module todo-module"><div class="module-head"><h2>待处理事项</h2></div><div class="stat-time">刷新时间：${formatTime(demoNow)}（示例）</div><div class="todo-groups">${pendingGroups.map(group=>`<section class="todo-group ${group.className||''}"><h3 class="todo-group-title">${group.name}</h3><div class="todo-subitems">${group.items.map(item=>`<article class="metric todo-item"><div class="metric-title">${item[0]}</div><div class="value"><span class="todo-count">${item[1]}</span><span class="count-unit">项</span></div><button class="detail" type="button" ${pendingUrls[item[2]]?`data-url="${pendingUrls[item[2]]}"`:''} aria-label="${item[0]}处理事项">处理事项</button></article>`).join('')}</div></section>`).join('')}</div></section>`;// #AI:design 圆环保留三类原有状态色，异常停工使用纹理。
let colors=['#3286FF','#31C2BF','#43C460','#F8CC2B'];document.getElementById('dashboard').innerHTML=sections.map((s,index)=>{let body=index===0?`<div class="renovation">${renovationDonut(s.items,colors)}<div class="pie-list">${s.items.map((item,i)=>`<div class="pie-row ${i===3?'pie-row-subset':''}" data-index="${i}" style="--shadow:${colors[i]}40">${i===3?'<svg class="pie-hatch-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 13 L13 2 M2 18 L18 2 M7 18 L18 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>':`<span class="pie-dot" style="background:${colors[i]}"></span>`}<span>${item[0]}</span><strong><span class="pie-count">${item[1]}</span> 项${i===1?`<small class="pie-note">包含 ${s.items[3][1]} 项异常停工</small>`:''}</strong><button class="detail" data-url="${urls[index]}" aria-label="${item[0]}数据详情">数据详情</button></div>`).join('')}</div></div>`:`<div class="grid">${s.items.map(item=>`<article class="metric"><div class="metric-title">${item[0]}</div><div class="metric-row"><div class="value">${s.name==='特殊作业'?'<span class="today-prefix">今日</span>':''}${item[1]}<span class="count-unit">项</span></div><div class="trend">${chart(demoValues(item,labels),labels,s.name==='特殊作业',s.name==='收房管理'||s.name==='交房管理')}</div></div><button class="detail" type="button" ${urls[index]?`data-url="${urls[index]}"`:''} aria-label="${item[0]}数据详情">数据详情</button></article>`).join('')}</div>`;return `<section class="module"><div class="module-head"><h2>${index===0?'装修管理':s.name}</h2></div><div class="stat-time">刷新时间：${formatTime(demoNow)}（示例）</div>${body}</section>`}).join('')}
// #AI:design 近一个月以目标月份对应日或月末为排除边界。
function recentMonthStart(date){let last=new Date(date.getFullYear(),date.getMonth(),0,12).getDate();return new Date(date.getFullYear(),date.getMonth()-1,Math.min(date.getDate(),last)+1,12)}
// #AI:design 自定义区间仅在完整且有效时应用。
renderDashboard();
// #AI:design 圆环扇区与右侧状态卡片双向同步悬停和键盘聚焦。
const dashboard=document.getElementById('dashboard');
function syncRenovationHover(event){let renovation=event.target.closest('.renovation');if(!renovation)return;requestAnimationFrame(()=>{let segments=[...renovation.querySelectorAll('.pie-segment')],rows=[...renovation.querySelectorAll('.pie-row')],activeSegment=segments.find(segment=>segment.matches(':hover,:focus')),activeRow=rows.find(row=>row.matches(':hover,:focus-within')),index=activeSegment?Number(activeSegment.dataset.index):activeRow?Number(activeRow.dataset.index):-1,shown=activeSegment||segments.find(segment=>Number(segment.dataset.index)===index);segments.forEach(segment=>segment.classList.toggle('is-active',segment===shown||(index===3&&Number(segment.dataset.index)===1)||(index===1&&Number(segment.dataset.index)===3)));rows.forEach((row,i)=>row.classList.toggle('is-active',i===index));let center=renovation.querySelector('.pie-center');if(center)center.innerHTML=shown?`<span class="pie-percent">${shown.dataset.percent}</span><span class="pie-divider" aria-hidden="true"></span><span class="pie-label">${shown.dataset.label} ${shown.dataset.count}项</span>`:''})}
dashboard.addEventListener('mouseover',syncRenovationHover);dashboard.addEventListener('mouseout',syncRenovationHover);dashboard.addEventListener('focusin',syncRenovationHover);dashboard.addEventListener('focusout',syncRenovationHover);
document.querySelector('.workspace').addEventListener('click',event=>{let button=event.target.closest('.detail[data-url]');if(button)window.open(button.dataset.url,'_blank','noopener,noreferrer')});
document.querySelectorAll('.theme-switch button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.workspace').classList.toggle('dark',button.dataset.theme==='dark');document.body.classList.toggle('content-dark-background',button.dataset.theme==='dark');document.querySelectorAll('.theme-switch button').forEach(option=>option.setAttribute('aria-pressed',String(option===button)))}));
// #AI:design 窗口跨越特殊作业四列紧凑区间时同步日期刻度。
let compactSpecial=window.innerWidth>1100&&window.innerWidth<=1300;window.addEventListener('resize',()=>{let compact=window.innerWidth>1100&&window.innerWidth<=1300;if(compact!==compactSpecial){compactSpecial=compact;renderDashboard()}});
// #AI:design 将当前菜单滚动到侧栏可见范围。
const sidebar=document.querySelector('.sidebar');sidebar.scrollTop=Math.max(0,sidebar.querySelector('.active-parent').offsetTop-32);
</script></body></html>
