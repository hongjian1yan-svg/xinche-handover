*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#606266;background:#f1f4f5}button,input,select{font:inherit}button{cursor:pointer}.top{height:60px;background:#fff;position:fixed;inset:0 0 auto;z-index:2;display:flex;align-items:center;box-shadow:0 2px 4px #00000014}.brand{width:180px;display:flex;align-items:center;padding-left:21px;color:#00a73b;font-weight:700;font-size:18px}.mark{width:34px;height:34px;border:2px solid #00a73b;border-radius:50%;display:grid;place-items:center;font-size:10px;margin-right:7px}.top-title{color:#303133;font-weight:600}.top-right{margin-left:auto;margin-right:30px;color:#909399}.sidebar{position:fixed;top:90px;bottom:0;width:180px;background:#fff;overflow:auto;color:#66798c}.nav-item{height:56px;display:flex;align-items:center;padding:0 20px;gap:8px}.nav-item.active-parent{color:#00a73b}.nav-icon{width:24px;color:#99a9b8;font-size:16px}.sub{height:50px;display:flex;align-items:center;padding-left:45px}.sub.active{background:#00a73b;color:white}.workspace{margin-left:180px;padding:77px 15px 80px;min-height:100vh}.card{background:#f9fafb;border-radius:4px;padding:20px 10px 38px}.tabs{display:flex;border-bottom:1px solid #dfe4eb;overflow-x:auto}.tab{height:40px;padding:0 20px;border:1px solid #dfe4eb;border-bottom:0;border-right:0;background:transparent;color:#303133;white-space:nowrap;font-weight:500}.tab:last-child{border-right:1px solid #dfe4eb}.tab.on{color:#00a73b;background:#f2f2f2}.filter{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;padding:15px 0 20px}.field{display:flex;align-items:center;gap:12px}.field label{white-space:nowrap}.control{height:40px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;color:#606266;padding:0 15px;min-width:190px}.control::placeholder{color:#c0c4cc}.control:focus{outline:none;border-color:#00a73b}.btn{height:40px;padding:0 20px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;color:#606266}.btn.primary{color:#fff;border-color:#00a73b;background:#00a73b}.btn:disabled{opacity:.5;cursor:not-allowed}.create{margin-left:auto}.table-wrap{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;background:white;min-width:930px;table-layout:fixed}th,td{border:1px solid #ebeef5;padding:12px 10px;line-height:23px;text-align:center;word-break:break-word}th{color:#909399;font-weight:700}td{color:#606266}.empty{height:60px;color:#909399}.mini{background:#00a73b;border:1px solid #00a73b;border-radius:3px;color:white;padding:6px 14px;font-size:12px}.link{border:0;background:none;color:#00a73b;padding:5px}.foot{position:fixed;right:30px;bottom:20px;padding:8px 12px;background:#fff;border:1px solid #eceef5;box-shadow:0 2px 4px #0000001a;border-radius:4px;font-size:13px}.badge{color:#00a73b;font-weight:700;margin:0 10px}.mask{position:fixed;inset:0;background:#0006;z-index:5;display:grid;place-items:start center;overflow:auto}.dialog{margin:15vh 0 50px;background:white;width:50%;min-width:540px;max-width:900px;box-shadow:0 1px 3px #0005;border-radius:2px}.dialog-head{padding:20px 20px 10px;color:#303133;font-size:18px;display:flex;justify-content:space-between}.close{border:0;background:none;color:#909399;font-size:22px;line-height:24px}.dialog-body{padding:25px 30px;max-height:58vh;overflow:auto}.dialog-foot{padding:10px 20px 20px;text-align:right}.dialog-foot button+button{margin-left:10px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ebeef5;border-left:1px solid #ebeef5}.detail-cell{border-right:1px solid #ebeef5;border-bottom:1px solid #ebeef5;padding:12px 15px;min-height:50px}.detail-cell span{color:#909399;display:inline-block;min-width:110px}.form-row{display:flex;align-items:center;margin-bottom:20px;gap:15px}.form-row label{width:120px;text-align:right}.form-row .control{width:260px}.checks{display:flex;gap:18px;flex-wrap:wrap}.notice{color:#909399;font-size:12px;margin:0 0 16px}.muted{color:#909399}.asterisk{color:#f56c6c}.hidden{display:none} @media(max-width:1100px){.create{margin-left:0}.dialog{width:75%;min-width:0}}
/* #AI:design PC 只读交接记录，沿用现有详情弹窗及内容滚动。 */
.record-title{margin:24px 0 12px;color:#303133;font-size:16px;font-weight:600}.record-category{border:1px solid #ebeef5;margin-bottom:16px}.record-category-head{padding:12px 15px;background:#f7f8fa;color:#303133;font-weight:600;display:flex;justify-content:space-between}.record-status{color:#00a73b;font-size:13px}.record-item{padding:12px 15px;border-top:1px solid #ebeef5;overflow-wrap:anywhere}.record-item h4{margin:0 0 8px;color:#303133;font-size:14px}.record-item p{margin:4px 0}.record-photo{display:block;width:160px;height:135px;object-fit:cover;border-radius:3px;margin:8px 0}.record-tag{color:#00a73b;margin-left:8px}.record-note{white-space:pre-wrap}
/* #AI:design 详情页交接项目状态标签：完好/损坏/无此项，与办理交接选择一致 */
.item-status{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:2px;font-size:12px;line-height:18px;border:1px solid transparent;white-space:nowrap}
.item-status.good{color:#1aba6c;background:#e8f9f0;border-color:#bcebd2}
.item-status.bad{color:#fa2b2d;background:#fff0f0;border-color:#ffd4d4}
.item-status.na{color:#666;background:#f3f4f6;border-color:#e4e4e4}

.claim-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5}.claim-shell{position:absolute;right:0;top:0;width:84%;height:100%;display:flex}.claim-close{flex:0 0 40px;width:40px;height:40px;margin-top:20px;border:0;background:#329aff;color:#fff;font-size:25px;line-height:40px}.claim-panel{flex:1;min-width:0;height:100%;background:#fff;display:flex;flex-direction:column}.claim-head{height:80px;flex:0 0 80px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #eaebec;color:#4a4a4a;font-size:18px;font-weight:600}.claim-scroll{flex:1;min-height:0;overflow:auto;background:#f9fafb;padding:12px}.claim-content{background:#fff;border-radius:8px;padding:40px;min-height:100%}.claim-section-title{font-size:14px;color:#303133;font-weight:600;margin:0 0 24px;border-left:5px solid #329aff;padding-left:10px}.claim-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid #eaebec;border-left:1px solid #eaebec;margin-bottom:20px}.claim-cell{min-width:0;border-right:1px solid #eaebec;border-bottom:1px solid #eaebec;padding:15px 30px;line-height:23px;overflow-wrap:anywhere}.claim-content .claim-table{width:100%;min-width:0;table-layout:fixed}.claim-table th,.claim-table td{padding:12px 10px}.claim-table td:nth-child(2){text-align:left}.claim-status{display:inline-block;padding:3px 8px;border-radius:3px;color:#e6a23c;background:#fdf6ec;border:1px solid #faecd8}

.tab-count{margin-left:6px;color:#909399;font-size:12px}.select-box{position:relative;width:190px}.select-trigger{width:100%;text-align:left;position:relative}.select-trigger:after{content:'⌄';position:absolute;right:13px;color:#c0c4cc}.select-options{position:absolute;z-index:4;top:45px;left:0;right:0;background:#fff;border:1px solid #e4e7ed;border-radius:4px;box-shadow:0 2px 12px #0000001a;padding:6px 0}.select-options button{width:100%;border:0;background:#fff;text-align:left;padding:8px 15px;color:#606266}.select-options button:hover{background:#f5f7fa}.select-options button.selected{color:#00a73b;font-weight:600}.filter-table{min-width:1850px}.claim-confirm{width:420px;min-width:0}.claim-confirm .dialog-body{padding:20px 20px 25px}

#elementTable .el-table table{min-width:0;table-layout:fixed}#elementTable .el-table th,#elementTable .el-table td{padding:12px 0;border-top:0;border-left:0;line-height:23px}#elementTable .el-table .cell{word-break:break-word}#elementTable .el-table .el-button--primary{background:#00a73b;border-color:#00a73b}#elementTable .el-table .el-button--text{color:#00a73b}
.filter{display:block;padding:15px 0 20px}.filter-fields{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px}.filter-fields .field{flex:0 0 auto}.field{min-width:0;gap:8px}.field label{min-width:80px;text-align:right;flex-shrink:0}.field > .el-select,.field > .el-date-editor.el-input{width:197.5px;flex:none}.field > .el-input{width:182.5px;flex:none}.filter-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:12px}.filter-actions .el-button+.el-button{margin-left:0}.filter-actions .el-button--primary{background:#00a73b;border-color:#00a73b}.el-select-dropdown .el-select-dropdown__item.selected,.el-date-table td.today span{color:#00a73b}.el-date-table td.current:not(.disabled) span{background:#00a73b}.el-picker-panel table{min-width:0;table-layout:auto}.el-picker-panel th,.el-picker-panel td{border:0;padding:4px 0;line-height:normal;word-break:normal}.el-date-table td{height:30px}.el-date-table th{padding:5px}.el-input.is-active .el-input__inner,.el-input__inner:focus,.el-select .el-input.is-focus .el-input__inner{border-color:#00a73b}

#tabs .el-tabs__header{margin:0;border-bottom:1px solid #dfe4eb}#tabs .el-tabs__nav{border-radius:0}#tabs .el-tabs__item{height:40px;line-height:40px;color:#303133}#tabs .el-tabs__item.is-active{background:#f2f2f2;color:#00a73b}#tabs .el-tabs__content{display:none}.preview-dialog .el-dialog__body{max-height:58vh;overflow:auto;padding:25px 30px}.preview-dialog .el-dialog__header{padding:20px 20px 10px}.preview-dialog .el-dialog__footer{padding:10px 20px 20px}.preview-form .el-select,.preview-form .el-input,.preview-form .el-date-editor{width:260px}.el-button--primary{background:#00a73b;border-color:#00a73b}.el-checkbox__input.is-checked .el-checkbox__inner{background:#00a73b;border-color:#00a73b}.el-checkbox__input.is-checked+.el-checkbox__label{color:#00a73b}.preview-drawer .el-drawer__header{height:80px;flex:0 0 80px;padding:0 20px;margin:0;border-bottom:1px solid #eaebec;color:#4a4a4a;font-size:18px;font-weight:600}.preview-drawer{overflow:visible}.preview-drawer .el-drawer__close-btn{position:absolute;left:-40px;top:20px;width:40px;height:40px;background:#329aff;color:#fff;font-size:22px}.preview-drawer .el-drawer__body{display:flex;min-height:0}.preview-drawer .claim-scroll{width:100%}.preview-drawer .el-table table{min-width:0;table-layout:fixed}.preview-drawer .el-table th,.preview-drawer .el-table td{padding:12px 0;border-top:0;border-left:0}.foot .el-pagination{font-weight:400}.foot .el-pagination .el-pager li.active{color:#00a73b}
</style></head><body>
<header class="top"><div class="brand"><span class="mark">2SC</span>商管系统</div><span class="top-title">【商管系统】</span><div id="roleDemo" class="top-right">原型示例数据 · 不连接业务系统　演示部门 <el-select v-model="dept" size="mini" @change="change" style="width:100px"><el-option label="物业部" value="物业部"></el-option><el-option label="安保部" value="安保部"></el-option><el-option label="管理部" value="管理部"></el-option></el-select>　演示角色 <el-select v-model="role" size="mini" @change="change" style="width:110px"><el-option label="部门主任" value="director"></el-option><el-option label="部门员工" value="employee"></el-option></el-select></div></header>
<aside class="sidebar" aria-label="后台导航"><div class="nav-item"><span class="nav-icon">▤</span>资讯管理</div><div class="nav-item"><span class="nav-icon">▣</span>活动管理</div><div class="nav-item"><span class="nav-icon">▧</span>投诉管理</div><div class="nav-item"><span class="nav-icon">▣</span>2SC账户管理</div><div class="nav-item"><span class="nav-icon">▧</span>施工期管理</div><div class="nav-item"><span class="nav-icon">▧</span>装修管理</div><div class="nav-item"><span class="nav-icon">▥</span>统计报表</div><div class="nav-item active-parent"><span class="nav-icon">▤</span>物业管理</div><div class="sub">交接类目管理</div><div class="sub active">交房交接</div><div class="sub">延时用电申请</div><div class="sub">维修类目管理</div><div class="sub">维修申请</div><div class="nav-item"><span class="nav-icon">▧</span>检测管理</div><div class="nav-item"><span class="nav-icon">▥</span>商户评级管理</div></aside>
<main class="workspace"><section class="card"><div id="tabs"><el-tabs v-model="selected" type="card" @tab-click="change"><el-tab-pane name="-1"><span slot="label">全部<span class="tab-count">{{allCount}}</span></span></el-tab-pane><el-tab-pane v-for="(name,i) in names" v-if="role==='director'||i<3||i>5" :key="name" :name="String(i)"><span slot="label">{{name}}<span class="tab-count">{{counts[i]}}</span></span></el-tab-pane></el-tabs></div><form class="filter" id="filters" @submit.prevent="apply"><div class="filter-fields">
<div class="field"><label>所属市场</label><el-select v-model="form.market" placeholder="全部" aria-label="所属市场"><el-option label="全部" value=""></el-option><el-option label="北京市旧机动车交易市场有限公司" value="北京市旧机动车交易市场有限公司"></el-option></el-select></div>
<div class="field"><label>交房类型</label><el-select v-model="form.type" placeholder="全部" aria-label="交房类型"><el-option label="全部" value=""></el-option><el-option v-for="v in ['新签商户','部门自用','部门交回']" :key="v" :label="v" :value="v"></el-option></el-select></div>
<!-- #AI:design:start -->
<div v-if="isAll" class="field"><label>交房状态</label><el-select v-model="form.status" placeholder="全部" aria-label="交房状态"><el-option label="全部" value=""></el-option><el-option v-for="v in statuses" :key="v" :label="v" :value="v"></el-option></el-select></div>
<!-- #AI:design:end -->
<div class="field"><label>所属区域</label><el-select v-model="form.region" placeholder="全部" aria-label="所属区域"><el-option label="全部" value=""></el-option><el-option label="A" value="A"></el-option><el-option label="G" value="G"></el-option></el-select></div>
<div class="field"><label>摊位号</label><el-input v-model="form.stall" placeholder="请输入摊位号" aria-label="摊位号"></el-input></div>
<div class="field"><label>房屋名称</label><el-input v-model="form.house" placeholder="请输入房屋名称" aria-label="房屋名称"></el-input></div>
<div class="field"><label>商户名称</label><el-input v-model="form.merchant" placeholder="请输入商户名称" aria-label="商户名称"></el-input></div>
<div class="field"><label>交房部门</label><el-select v-model="form.deliveryDept" placeholder="全部" aria-label="交房部门"><el-option label="全部" value=""></el-option><el-option label="财务部" value="财务部"></el-option></el-select></div>
<div class="field"><label>交接部门</label><el-select v-model="form.dept" placeholder="全部" aria-label="交接部门"><el-option label="全部" value=""></el-option><el-option label="物业部" value="物业部"></el-option><el-option label="安保部" value="安保部"></el-option></el-select></div>
<div class="field"><label>计划交房日期</label><el-date-picker v-model="form.date" type="date" value-format="yyyy-MM-dd" placeholder="选择日期" aria-label="计划交房日期"></el-date-picker></div>
</div><div class="filter-actions"><el-button type="primary" native-type="submit">查询</el-button><el-button @click="reset">重置</el-button><el-button type="primary" @click="createTask">新增交房任务</el-button><el-button v-if="showExport" @click="exportList">导出</el-button></div></form><div id="elementTable"><el-table :data="list" border style="width:100%" empty-text="暂无数据">
<el-table-column type="index" label="序号" width="65" align="center"></el-table-column><el-table-column prop="market" label="所属市场" min-width="130" align="center"></el-table-column><el-table-column prop="type" label="交房类型" min-width="115" align="center"></el-table-column><el-table-column v-if="isAll" key="status" prop="status" label="交房状态" min-width="120" align="center"></el-table-column><el-table-column prop="region" label="所属区域" min-width="110" align="center"></el-table-column><el-table-column prop="stall" label="摊位号" min-width="120" align="center"></el-table-column><el-table-column prop="house" label="房屋名称" min-width="200" align="center"></el-table-column><el-table-column prop="merchant" label="商户名称" min-width="180" align="center"></el-table-column><el-table-column prop="department" label="交房部门" min-width="120" align="center"></el-table-column><el-table-column prop="category" label="交接类别" min-width="160" align="center"></el-table-column><el-table-column prop="dept" label="交接部门" min-width="160" align="center"></el-table-column><el-table-column v-if="showOwners" key="owners" prop="owners" label="交接负责人列表" min-width="190" align="center"></el-table-column><el-table-column v-if="isAll" key="plannedTime" prop="plannedTime" label="计划交房时间" min-width="180" align="center"></el-table-column><el-table-column v-if="isAll" key="confirmTime" prop="confirmTime" label="确认时间" min-width="180" align="center"></el-table-column><el-table-column v-if="!isAll" key="time" prop="time" :label="timeLabel" min-width="180" align="center"></el-table-column><el-table-column label="操作" min-width="175" align="center"><template slot-scope="scope"><el-button type="primary" size="mini" @click="view(scope.row.index)">查看</el-button><el-button v-if="isApproval" type="text" @click="approve(scope.row.index)">立即审批</el-button><template v-if="isClaim && scope.row.canHandle"><el-button type="text" @click="assignTask(scope.row.index)">指派</el-button><el-button type="text" @click="claimTask(scope.row.index)">认领</el-button></template></template></el-table-column></el-table></div></section></main><div class="foot" id="pagination"><el-pagination :total="total" :page-size="10" layout="total, sizes, prev, pager, next" :page-sizes="[10]"></el-pagination></div>
<div id="overlay">
<el-dialog :title="title" :visible.sync="dialogVisible" :width="kind==='claim'?'420px':'50%'" :close-on-click-modal="false" @closed="closed" custom-class="preview-dialog">
<template v-if="kind==='claim'"><div>是否认领此交房任务</div></template>
<template v-if="kind==='detail'"><div v-html="detailHtml"></div></template><template v-if="kind==='approval'"><h3>交房基本信息</h3><div v-html="detailHtml"></div><h3>交接项目</h3><div v-html="approvalHtml"></div><h3>审批操作</h3><el-radio-group v-model="approvalChoice"><el-radio label="pass">通过</el-radio><el-radio label="reject">驳回</el-radio></el-radio-group><div v-if="approvalChoice==='reject'" style="margin-top:18px"><label><span class="asterisk">*</span> 驳回原因</label><el-input v-model="approvalReason" type="textarea" placeholder="请输入驳回原因"></el-input><p v-if="approvalError" style="color:#f56c6c">请输入驳回原因</p></div></template>
<!-- #AI:design:start -->
<template v-if="kind==='create'"><p class="notice">以下为小程序已有规则的 PC 展示示例，任务不会提交或保存。</p><el-form label-width="135px" class="preview-form">
<el-form-item label="交房类型" required><el-select v-model="form.type" @change="typeChanged"><el-option v-for="v in createTypes" :key="v" :label="v" :value="v"></el-option></el-select></el-form-item>
<template v-if="form.type==='新签商户'"><el-form-item label="摊位号" required><el-select v-model="form.object" filterable placeholder="请选择摊位号"><el-option v-for="c in contracts" :key="c.stall" :label="c.stall+'（'+c.rent+'）'" :value="c.stall" :disabled="!c.allowed"></el-option></el-select></el-form-item><div v-if="chosenContract" class="detail-grid"><div class="detail-cell" v-for="r in contractInfo" :key="r[0]"><span>{{r[0]}}：</span>{{r[1]}}</div></div></template>

function details(i){detailOpen=i;const s=samples[i],shared=sharedEntry(i),isHouse=s.type!=='新签商户',object=s.object.split('：').slice(1).join('：'),value=v=>v||'—',time=active===7?(shared.final?.time||(s.dynamic?'':isHouse?'2026-12-20 10:34:56':'2026-10-20 10:34:56')):s.date;let fields=[['任务编号',s.number],['所属市场',value(s.market)],['交房类型',value(s.type)],['所属区域',value(s.region)],...(isHouse?[['房屋名称',value(object)],['交房部门',value(s.use)]]:[['摊位号',value(object)],['商户名称',value(s.name)]]),['交接类别',value(s.category)],['交接部门',value(s.dept)],...(active===0?[]:[['交接负责人列表',ownersFor(s,shared)]]),[active===7?'确认时间':'计划交房时间',value(time)],...(isHouse?[[s.type==='部门交回'&&active===0?'停用部门':'使用部门',s.use],['房屋面积',s.area],['建筑编号',s.building],['土地证书编号',s.land]]:[['房屋面积',s.area],['室内车位',s.dynamic?'—':'5个'],['室外车位',s.dynamic?'—':'17个'],['合同开始日期',s.dynamic?'—':'2026-12-20'],['合同截止日期',s.dynamic?'—':'2027-12-23']])];overlayApp.basicHtml=`<div class="detail-grid">${fields.map(f=>`<div class="detail-cell"><span>${safe(f[0])}</span>${safe(f[1])}</div>`).join('')}</div>`;if(overlayApp.openApproval){overlayApp.openApproval=false;overlayApp.detailHtml=overlayApp.basicHtml;overlayApp.approvalHtml=approvalContent(i);overlayApp.approvalIndex=i;overlayApp.approvalChoice='pass';overlayApp.approvalReason='';overlayApp.approvalError=false;overlayApp.kind='approval';overlayApp.title='立即审批';overlayApp.dialogVisible=true;return}claimDetails(s,fields,i);}
